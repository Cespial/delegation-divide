[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "adi-index"
version = "2026.1.dev0"
description = "Agent Delegability Index (ADI): lookup, search and citation of AI-agent delegability for 433 ISCO-08 occupations and 146 countries."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Cristian Espinal Maya", email = "cristian@inplux.co" },
  { name = "Santiago Jiménez Londoño" },
]
keywords = ["ai-agents", "delegation", "labour-economics", "ISCO-08", "ESCO", "index", "atlas"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Cespial/delegation-divide"
Repository = "https://github.com/Cespial/delegation-divide"
Paper = "https://github.com/Cespial/delegation-divide/blob/main/README.md"

[project.scripts]
adi = "adi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["adi"]

[tool.hatch.build.targets.sdist]
include = ["adi", "tests", "README.md", "LICENSE", "pyproject.toml", "sincronizar.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
